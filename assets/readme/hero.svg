<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Medusa Payment Peach Payments. A hardened Peach Payments Checkout V2 provider for Medusa v2.">
  <defs>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC59E"/>
      <stop offset="1" stop-color="#FF6F3C"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12171f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="300" fill="url(#peach)"/>
  <text x="64" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#e6edf3">Medusa Payment <tspan fill="url(#peach)">Peach Payments</tspan></text>
  <text x="66" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">A hardened Peach Payments (Checkout V2) provider for Medusa v2.</text>
  <text x="66" y="230" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#768390">authorize-on-return  ·  webhook re-confirm  ·  amount-integrity gate  ·  V1 HMAC refunds</text>
  <text x="66" y="260" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13.5" fill="#545c66">verify signature  →  re-confirm outcome + amount against /status  →  only then fulfil</text>
</svg>
