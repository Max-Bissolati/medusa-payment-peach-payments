name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: verify publish artifact
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          # The tarball must ship the built plugin and its type declarations,
          # and nothing from src/ or examples/ (including compiled spec files).
          # Positive-logic ifs: `set -e` ignores `!`-inverted commands, which
          # silently disarms negated grep assertions.
          grep -q ".medusa/server/src/providers/peach/index.js" pack.txt
          grep -q ".medusa/server/src/providers/peach/index.d.ts" pack.txt
          if grep -E "^npm notice [0-9.]+[kMB ]+ (src|examples)/" pack.txt; then
            echo "publish artifact leaks src/ or examples/" >&2
            exit 1
          fi
          if grep -E "\.spec\.(js|ts|d\.ts)" pack.txt; then
            echo "publish artifact leaks spec files" >&2
            exit 1
          fi
